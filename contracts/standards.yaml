# SoulAuth Standards Registry
#
# 法位：Machine Contract Authority。
#
# GA-07 §24 与 §30 把六个状态严格分开，本文件只使用这套词汇：
#
#   implemented  Runtime 里有对应行为
#   supported    进入正式 Public Support Contract（比 implemented 窄）
#   tested       有针对本 Release 的 Evidence，且 Evidence Subject 明确
#   conformant   通过对应规范的一致性测试
#   certified    完成 Standards Organization 的正式认证流程
#
# 三条纪律（V3 22｜Standards & Conformance）：
#
#   Internal Revocation Semantics  ≠  RFC 7009 Support
#   Internal / Online Token Lookup ≠  RFC 7662 Introspection
#   SoulAuth issues Access Tokens  ≠  RFC 9068 Conformance
#
# 「内部有类似动作」不构成对某个标准端点的支持。没有实现对应 wire contract
# 就不得在发现文档里 advertise —— 由 tests/conformance.rs::h10 静态守住。
#
# certified 一栏当前全部为 false，且不存在任何进行中的认证流程。

registry: soulauth-standards
version: 1

specifications:
  - id: rfc6749
    title: The OAuth 2.0 Authorization Framework
    role: authorization-server
    implemented: true
    supported: true
    tested: true
    conformant: false
    certified: false
    scope: >-
      仅 authorization code grant 与 refresh token grant。
      client credentials、device code、implicit、ROPC 均未实现。
    evidence: tests/integration.sh（第 7 组 OIDC 授权码流程与 sid）

  - id: openid-connect-core-1.0
    title: OpenID Connect Core 1.0
    role: openid-provider
    implemented: true
    supported: true
    tested: true
    conformant: false
    certified: false
    scope: >-
      Authorization Code Flow。ID Token 为 RS256，含 sid（强制，取不到会话
      引用时拒签而不是签发残缺令牌）。implicit 与 hybrid flow 未实现。
    evidence: tests/integration.sh（ID Token sid / RS256 / scope 裁剪断言）

  - id: openid-connect-discovery-1.0
    title: OpenID Connect Discovery 1.0
    role: openid-provider
    implemented: true
    supported: true
    tested: true
    conformant: false
    certified: false
    scope: >-
      /.well-known/openid-configuration，同时挂在 /api/oidc/ 前缀下 ——
      同一处理器两个路径，兼容两种客户端惯例。
      声明内容与 Runtime 一致，不 advertise 未实现的端点。
    evidence: tests/conformance.rs::h10 + tests/integration.sh（第 1 组）

  - id: rfc7636
    title: "PKCE: Proof Key for Code Exchange"
    role: authorization-server
    implemented: true
    supported: true
    tested: true
    conformant: false
    certified: false
    scope: >-
      仅 S256。plain 被显式拒绝 —— 它的 challenge 等于 verifier 本身，
      能看到授权请求的一方直接拿到 verifier，等于没有 PKCE。
      公开客户端强制要求；缺 code_challenge_method 同样拒绝。
    evidence: tests/integration.sh（PKCE plain 被拒绝 / 缺 method 被拒绝）

  - id: rfc7519
    title: JSON Web Token
    role: issuer
    implemented: true
    supported: true
    tested: true
    conformant: false
    certified: false
    scope: ID Token 与会话令牌。Access Token 不承诺任何内部结构。

  - id: rfc7517
    title: JSON Web Key
    role: issuer
    implemented: true
    supported: true
    tested: true
    conformant: false
    certified: false
    scope: /api/oidc/jwks 发布 RS256 公钥，供消费方本地验签。

  - id: rfc6750
    title: The OAuth 2.0 Authorization Framework - Bearer Token Usage
    role: authorization-server
    implemented: partial
    supported: false
    tested: false
    conformant: false
    certified: false
    scope: >-
      令牌以 Authorization: Bearer 传递（方案名不区分大小写）。
      但 WWW-Authenticate 响应头与 invalid_token / insufficient_scope
      错误语义**尚未实现** —— 那是资源服务器侧的责任，SoulAuth 作为
      授权服务器未提供这部分。因此 supported: false。

  # ── 以下未实现。列出它们是因为生态里很容易被默认为存在 ──
  # V3 30｜Project Status §12：必须特别确认那些用户容易误认为支持的能力。

  - id: rfc7009
    title: OAuth 2.0 Token Revocation
    role: authorization-server
    implemented: false
    supported: false
    tested: false
    conformant: false
    certified: false
    scope: >-
      **没有 /revoke 端点。**
      SoulAuth 内部确实有令牌吊销语义（改密、停用、刷新令牌复用检测都会
      吊销令牌族），但那是内部行为，不是 RFC 7009 的 wire contract。
      Internal Revocation Semantics ≠ RFC 7009 Support。

  - id: rfc7662
    title: OAuth 2.0 Token Introspection
    role: authorization-server
    implemented: false
    supported: false
    tested: false
    conformant: false
    certified: false
    scope: >-
      **没有 /introspect 端点。**
      Access Token 在服务端确实是可查的（它是库里的一行），但那是实现细节，
      不是标准化的 introspection 协议。
      消费方应本地验签 ID Token，而不是期待 introspection。

  - id: rfc9068
    title: JWT Profile for OAuth 2.0 Access Tokens
    role: authorization-server
    implemented: false
    supported: false
    tested: false
    conformant: false
    certified: false
    scope: >-
      Access Token 当前是不透明串，不是 JWT。
      「SoulAuth 签发 Access Token」不等于 RFC 9068 符合 ——
      消费方不得假设它可以被 base64 解开或本地验签。

  - id: rfc8414
    title: OAuth 2.0 Authorization Server Metadata
    role: authorization-server
    implemented: false
    supported: false
    tested: false
    conformant: false
    certified: false
    scope: >-
      没有 /.well-known/oauth-authorization-server。
      OIDC Discovery 文档覆盖了实际需要的元数据，但它是 OIDC 的规范，
      不是 RFC 8414。

  - id: rfc8705
    title: OAuth 2.0 Mutual-TLS Client Authentication
    role: authorization-server
    implemented: false
    supported: false
    tested: false
    conformant: false
    certified: false
    scope: 客户端认证仅支持 client_secret_post 与 client_secret_basic。

  - id: rfc7523
    title: JWT Profile for OAuth 2.0 Client Authentication and Authorization Grants
    role: authorization-server
    implemented: false
    supported: false
    tested: false
    conformant: false
    certified: false
    scope: >-
      AIActor 的签名断言认证走这条规范，但**当前 Release 未实现**。
      V3 24 §2 要求在冻结 credential representation、algorithm allowlist、
      canonicalization、challenge/nonce、replay semantics 等全部条目之前，
      不得把它描述为完整的公开认证方式。

# 客户端认证方法（与发现文档的 token_endpoint_auth_methods_supported 一致）
client_authentication_methods:
  - client_secret_post
  - client_secret_basic
  - none

# 两处同时带凭据会以 invalid_request 被拒，不会「挑一个用」——
# 那会让「两处 secret 不一致」这种明显异常被静默接受。
client_authentication_note: >-
  credentials must appear in exactly one location per request

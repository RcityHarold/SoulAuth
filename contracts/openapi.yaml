# SoulAuth Published OpenAPI Contract
#
# 法位：Machine Contract Authority。
#
# GA-07 §17-19 与 §50：Human Reference 与 Guide 都不得自行创造 Endpoint、
# Field、Config Key、Permission、Wire Enum 或 Token Representation。
# 这里是它们的**唯一**来源。
#
# 生成依据：src/main.rs 的 axum 路由表 + src/routes/**。
# 由 tests/conformance.rs::j4 断言与 Runtime 一致 —— 手工增删端点会让它变红。
#
# 当前范围：路径、方法、认证要求、所需权限、**Error Envelope**。
#
# 成功响应的 schema 仍未冻结（23 §3-4：Serialization Contract 必须由工程侧
# 先冻结，不能由契约文件反向发明），因此这里不声明 requestBody 与 2xx schema。
#
# Error Envelope 现在可以声明了：全站错误已收口成同一形状，由
# tests/conformance.rs::g3（码是稳定字面量）与 ::j6（没有第二种形状）守住。
openapi: 3.1.0
info:
  title: SoulAuth
  version: "0.1.0"
  description: >-
    Actor-native identity and authentication infrastructure.
    Endpoint surface only; payload schemas are not yet frozen.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: "{APP_URL}"
    description: >-
      The public address, set by APP_URL. It is also the OIDC issuer — the two
      must match character for character.
    variables:
      APP_URL:
        default: http://localhost:8080

components:
  schemas:
    Error:
      type: object
      required: [error, message]
      additionalProperties: true
      description: >-
        The single error envelope used across the whole API. `error` is a
        **stable machine-readable code** — branch on it. `message` is prose: its
        wording may improve at any time and must not be used for decisions.
        Individual errors carry documented additional fields.
      properties:
        error:
          type: string
          description: Stable error code, snake_case.
          enum:
            - internal_error
            - invalid_credentials
            - email_not_verified
            - invalid_token
            - user_not_found
            - email_exists
            - username_exists
            - oauth_error
            - password_already_set
            - invalid_user_id
            - not_found
            - validation_error
            - permission_denied
            - insufficient_permissions
            - missing_permission
            - account_suspended
            - account_inactive
            - account_deleted
            - account_locked
            - forbidden
            - bad_request
            - not_configured
            - unauthorized
            - service_unavailable
        message:
          type: string
          description: Human-readable explanation. Not part of the contract.
        required_permission:
          type: string
          description: Carried by `missing_permission` only — which permission is missing.
        locked_until_seconds:
          type: integer
          description: Carried by `account_locked` only — seconds until the lock clears.

    OAuthError:
      type: object
      required: [error]
      description: >-
        Used by the OIDC protocol endpoints **only** (/api/oidc/token and
        friends). The shape is mandated by RFC 6749 §5.2 and cannot be unified
        with the Error envelope above.
      properties:
        error:
          type: string
        error_description:
          type: string

  securitySchemes:
    # 三种，不是一种。
    #
    # 把它们混成一个 `bearerAuth` 会产生具体的误导：读契约的人会以为
    # /api/oidc/userinfo 收的是登录拿到的那枚会话令牌 —— 它收的是 OIDC
    # 访问令牌，两者由不同端点签发、生命周期也不同。
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Session token, from POST /api/auth/login (or POST
        /api/actors/authenticate for an AI actor). Used by every /api business
        endpoint.
    oidcAccessToken:
      type: http
      scheme: bearer
      description: >-
        OIDC access token, from POST /api/oidc/token. Used by
        /api/oidc/userinfo **only**. Not interchangeable with the session token
        above.
    browserSession:
      type: apiKey
      in: cookie
      name: soulauth_session
      description: >-
        Browser session cookie. /api/oidc/authorize uses it to decide whether
        this browser is logged in; its absence is a redirect to the login page,
        not an error.

tags:
  - name: AI Actors
  - name: Actors & Profiles
  - name: Administration
  - name: Audit
  - name: Authentication
  - name: Bootstrap
  - name: Health
  - name: OIDC
  - name: OIDC Clients
  - name: Operations
  - name: Security

paths:
  /.well-known/openid-configuration:
    get:
      tags: [OIDC]
      operationId: oidc_openid_configuration
      security: []
      responses:
        "200":
          description: OK

  /api/actors:
    get:
      tags: [AI Actors]
      operationId: actors_list_actors
      security:
        - bearerAuth: []
      x-required-permissions: [soulauth:actors.read]
      responses:
        "200":
          description: OK
    post:
      tags: [AI Actors]
      operationId: actors_register
      description: >-
        Register a non-human actor and attach its first Ed25519 verification
        key. No HumanAccount is created — an AI actor has no email, username or
        password.
      description_zh: >-
        注册一个非人主体并挂上第一枚 Ed25519 验证密钥。
        不创建 HumanAccount —— AIActor 没有邮箱、用户名或口令。
      security:
        - bearerAuth: []
      x-required-permissions: [soulauth:actors.write]
      responses:
        "200":
          description: OK

  /api/actors/:actor_id:
    get:
      tags: [AI Actors]
      operationId: actors_get_actor
      security:
        - bearerAuth: []
      x-required-permissions: [soulauth:actors.read]
      responses:
        "200":
          description: OK

  /api/actors/:actor_id/credentials:
    get:
      tags: [AI Actors]
      operationId: actors_list_credentials
      security:
        - bearerAuth: []
      x-required-permissions: [soulauth:actors.read]
      responses:
        "200":
          description: OK
    post:
      tags: [AI Actors]
      operationId: actors_add_credential
      description: >-
        Add another key. Having several active at once is what makes rotation
        safe.
      description_zh: 追加一枚密钥。多枚并存是安全轮换的前提。
      security:
        - bearerAuth: []
      x-required-permissions: [soulauth:actors.write]
      responses:
        "200":
          description: OK

  /api/actors/:actor_id/credentials/:credential_id:
    delete:
      tags: [AI Actors]
      operationId: actors_revoke_credential
      description: >-
        Revoke a key. The record is not deleted — otherwise the audit trail
        loses the answer to which key a past authentication used.
      description_zh: >-
        吊销一枚密钥。记录不删除 —— 否则历史审计里「这次认证用的是哪把钥匙」
        无从追溯。
      security:
        - bearerAuth: []
      x-required-permissions: [soulauth:actors.write]
      responses:
        "200":
          description: OK

  /api/actors/authenticate:
    post:
      tags: [AI Actors]
      operationId: actors_authenticate
      description: >-
        Step two: submit an Ed25519 signature over the challenge in exchange for
        a session token. The signed content is recomputed independently by the
        server; the payload echoed back in the request is never used. The
        challenge is consumed atomically **before** verification, so a failed
        attempt burns it too.
      description_zh: >-
        第二步：提交对挑战的 Ed25519 签名，换一枚会话令牌。
        被签名内容由服务端独立重算，绝不采用请求里回传的 payload。
        挑战在验签**之前**被原子消费 —— 一次失败也会烧掉它。
      responses:
        "200":
          description: OK

  /api/actors/challenge:
    post:
      tags: [AI Actors]
      operationId: actors_challenge
      description: >-
        Step one: obtain a single-use challenge (public endpoint). An unknown
        actor and a suspended actor both return the same invalid_credentials,
        so this cannot become a channel for enumerating subjects.
      description_zh: >-
        第一步：领一枚一次性挑战（公开端点）。
        actor 不存在与已停用返回同一个 invalid_credentials，
        以免这里成为枚举主体的信道。
      responses:
        "200":
          description: OK

  /api/actors/me:
    get:
      tags: [AI Actors]
      operationId: actors_me
      description: >-
        Agent introspection. A human session token is explicitly refused with
        403 forbidden.
      description_zh: Agent 自省。人类会话令牌会被明确拒绝（403 forbidden）。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK


# SoulAuth Published OpenAPI Contract
#
# 法位：Machine Contract Authority。
#
# GA-07 §17-19 与 §50：Human Reference 与 Guide 都不得自行创造 Endpoint、
# Field、Config Key、Permission、Wire Enum 或 Token Representation。
# 这里是它们的**唯一**来源。
#
# 生成依据：src/main.rs 的 axum 路由表 + src/routes/**。
# 由 tests/conformance.rs::j4 断言与 Runtime 一致 —— 手工增删端点会让它变红。
#
# 当前范围：路径、方法、认证要求、所需权限。
# **请求/响应 schema 尚未冻结**，因此本文件不声明 requestBody 与 response
# schema —— 按 23 §3-4，Serialization Contract 与 Error Envelope 需要先由
# 工程侧冻结，不能由契约文件反向发明。
openapi: 3.1.0
info:
  title: SoulAuth
  version: "0.1.0"
  description: >-
    Actor-native identity and authentication infrastructure.
    Endpoint surface only; payload schemas are not yet frozen.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: "{APP_URL}"
    description: >-
      公开地址，由 APP_URL 配置。它同时是 OIDC issuer —— 二者必须逐字一致。
    variables:
      APP_URL:
        default: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        会话令牌，来自 POST /api/auth/login。
        OIDC 协议端点不用它：/authorize 认浏览器会话 cookie，
        /token 认客户端凭据。

tags:
  - name: Actors & Profiles
  - name: Administration
  - name: Audit
  - name: Authentication
  - name: Bootstrap
  - name: Health
  - name: OIDC
  - name: OIDC Clients
  - name: Operations
  - name: Security

